<!-- Structing HTML Page With HTML5 Semantic Tags -->



<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 5 </title>
</head>

<body>
    <header>
        <h1>HTML 5 Semantic Tags</h1>
    </header>
    <nav>
        <ul>
            <li id="section1" style="cursor: pointer; color: blue;">Section 1</li>
            <li id="section2" style="cursor: pointer; color: blue;">Section 2</li>
        </ul>
    </nav>
    <main>
        <section>
            <h2>Section 1</h2>
            <p>This is the first section of the page.</p>
        </section>
        <section>
            <h2>Section 2</h2>
            <p>This is the second section of the page.</p>
        </section>
    </main>
    <hr>
    <footer>
        <p>&copy; 2024 HTML 5 Semantic Tags Example</p>
    </footer>
</body>

</html>
